<!-- frontend/src/app/pages/mfa-verify/mfa-verify.html -->
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4 transition-colors duration-300">
  <div class="bg-white dark:bg-gray-800 p-6 sm:p-10 rounded-xl shadow-lg w-full max-w-md">

    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 mb-4 rounded-2xl bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-blue-800 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="text-2xl font-extrabold text-blue-900 dark:text-blue-400">Verificação em duas etapas</h2>
      <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">
        {{ usarBackupCode() ? 'Informe um dos seus códigos de backup.' : 'Digite o código de 6 dígitos do seu aplicativo autenticador.' }}
      </p>
    </div>

    <div *ngIf="errorMessage()"
      class="mb-6 p-4 bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 text-red-700 dark:text-red-300 text-sm rounded-r-lg">
      {{ errorMessage() }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label for="code" class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">
          {{ usarBackupCode() ? 'Código de backup' : 'Código de verificação' }}
        </label>
        <input type="text" id="code" name="code" [(ngModel)]="code" [attr.inputmode]="usarBackupCode() ? 'text' : 'numeric'"
          [attr.maxlength]="usarBackupCode() ? 10 : 6" autocomplete="one-time-code" autofocus
          placeholder="{{ usarBackupCode() ? 'XXXXXXXXXX' : '000000' }}"
          class="block w-full px-4 py-3 text-center text-lg tracking-widest bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:bg-white dark:focus:bg-gray-600 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all duration-200 text-gray-900 dark:text-gray-100">
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full flex justify-center py-3.5 px-4 rounded-xl shadow-lg shadow-blue-800/30 text-sm font-bold text-white bg-blue-800 hover:bg-blue-900 dark:bg-blue-700 dark:hover:bg-blue-600 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        {{ isLoading() ? 'Verificando...' : 'Confirmar' }}
      </button>
    </form>

    <div class="mt-6 text-center">
      <button type="button" (click)="toggleBackupCode()" class="text-sm text-blue-800 dark:text-blue-400 font-medium hover:underline">
        {{ usarBackupCode() ? 'Usar código do aplicativo autenticador' : 'Perdeu o acesso? Usar código de backup' }}
      </button>
    </div>

    <div class="mt-8 text-center border-t border-gray-100 dark:border-gray-700 pt-6">
      <a routerLink="/login" class="text-sm text-gray-500 dark:text-gray-400 hover:underline">&larr; Voltar pro login</a>
    </div>

  </div>
</div>
