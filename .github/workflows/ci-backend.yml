name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: JUnit + JaCoCo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sistema_lucas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # -P ci apontava pra um profile Maven que não existe no pom.xml (nenhum <profiles> definido),
      # e o passo de upload abaixo esperava um relatório JaCoCo que nunca é gerado (plugin não
      # configurado) — o workflow nunca rodou de verdade assim. Alinhado ao que o pom.xml
      # realmente tem: só ./mvnw verify (roda a suíte de teste completa + empacota o jar).
      - name: Run tests
        run: ./mvnw verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sistema_lucas_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          ENCRYPTION_KEY: 1234567890123456
          JWT_SECRET: test-secret-at-least-32-characters-long
          ALLOWED_ORIGINS: http://localhost:4200
